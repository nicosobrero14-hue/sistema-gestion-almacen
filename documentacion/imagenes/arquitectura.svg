<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1020" viewBox="0 0 1560 1020" font-family="'Segoe UI', Tahoma, Arial, sans-serif">
<defs>
  <marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#56677A"/>
  </marker>
  <filter id="sombra" x="-5%" y="-5%" width="115%" height="115%">
    <feDropShadow dx="1.5" dy="2" stdDeviation="2" flood-color="#1B2733" flood-opacity="0.16"/>
  </filter>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="40" y="46" font-size="22" font-weight="700" fill="#1B2733" text-anchor="start">Arquitectura de la solución — Sistema de Gestión de Almacén y Control de Stock</text>
<text x="40" y="72" font-size="13" font-weight="400" fill="#5B6B7A" text-anchor="start">Cliente-servidor en red local · backend en capas con API REST · base de datos relacional</text>
<rect x="300" y="110" width="900" height="800" rx="10" fill="#F4F6F8" stroke="#7D8B99" stroke-width="1.2" stroke-dasharray="8 5"/>
<text x="318" y="138" font-size="14" font-weight="700" fill="#5B6B7A" text-anchor="start">Terminal del comercio — Windows 10 u 11</text>
<text x="318" y="158" font-size="11.5" font-weight="400" fill="#5B6B7A" text-anchor="start">Todo corre en la misma máquina. No necesita internet para vender.</text>
<rect x="340" y="180" width="820" height="150" rx="6" fill="#98BFDA" stroke="#7D8B99" stroke-width="1.2" filter="url(#sombra)"/><text x="354" y="204" font-size="14" font-weight="700" fill="#1B2733" text-anchor="start">Navegador · Frontend React (Vite)</text>
<rect x="355" y="215" width="250" height="100" rx="6" fill="#fff" stroke="#7D8B99" stroke-width="1.2"/>
<text x="367" y="237" font-size="12.5" font-weight="600" fill="#1B2733" text-anchor="start">Pantallas</text>
<text x="367" y="258" font-size="11.5" font-weight="400" fill="#5B6B7A" text-anchor="start">Productos, proveedores</text>
<text x="367" y="275" font-size="11.5" font-weight="400" fill="#5B6B7A" text-anchor="start">usuarios, ventas, panel</text>
<rect x="620" y="215" width="250" height="100" rx="6" fill="#fff" stroke="#7D8B99" stroke-width="1.2"/>
<text x="632" y="237" font-size="12.5" font-weight="600" fill="#1B2733" text-anchor="start">Componentes</text>
<text x="632" y="258" font-size="11.5" font-weight="400" fill="#5B6B7A" text-anchor="start">Formularios, tablas,</text>
<text x="632" y="275" font-size="11.5" font-weight="400" fill="#5B6B7A" text-anchor="start">ventanas y avisos</text>
<rect x="885" y="215" width="250" height="100" rx="6" fill="#fff" stroke="#7D8B99" stroke-width="1.2"/>
<text x="897" y="237" font-size="12.5" font-weight="600" fill="#1B2733" text-anchor="start">Cliente HTTP (axios)</text>
<text x="897" y="258" font-size="11.5" font-weight="400" fill="#5B6B7A" text-anchor="start">Un solo lugar donde</text>
<text x="897" y="275" font-size="11.5" font-weight="400" fill="#5B6B7A" text-anchor="start">se arma cada pedido</text>
<path d="M750 330 V410" fill="none" stroke="#56677A" stroke-width="1.8" marker-end="url(#punta)"/><rect x="604.4" y="359" width="291.2" height="20" rx="10" fill="#fff" stroke="#E1E6EB"/><text x="750" y="373" font-size="11.5" font-weight="400" fill="#5B6B7A" text-anchor="middle">HTTP · JSON · cookie de sesión y token CSRF</text>
<rect x="340" y="410" width="820" height="272" rx="6" fill="#A8D5A0" stroke="#7D8B99" stroke-width="1.2" filter="url(#sombra)"/>
<text x="354" y="434" font-size="14" font-weight="700" fill="#1B2733" text-anchor="start">Servidor de aplicación · Spring Boot en el puerto 8080</text>
<rect x="354" y="450" width="610" height="54" rx="6" fill="#fff" stroke="#7D8B99" stroke-width="1.2"/>
<text x="368" y="472" font-size="12.5" font-weight="600" fill="#1B2733" text-anchor="start">Controladores REST</text>
<text x="368" y="490" font-size="11.5" font-weight="400" fill="#5B6B7A" text-anchor="start">Reciben el pedido, validan el formato y responden. Sin reglas de negocio.</text>
<path d="M659 504 V512" stroke="#56677A" stroke-width="1.6" marker-end="url(#punta)"/>
<rect x="354" y="512" width="610" height="54" rx="6" fill="#fff" stroke="#7D8B99" stroke-width="1.2"/>
<text x="368" y="534" font-size="12.5" font-weight="600" fill="#1B2733" text-anchor="start">Servicios</text>
<text x="368" y="552" font-size="11.5" font-weight="400" fill="#5B6B7A" text-anchor="start">Las reglas del negocio: stock, ofertas, último administrador, confirmación de venta.</text>
<path d="M659 566 V574" stroke="#56677A" stroke-width="1.6" marker-end="url(#punta)"/>
<rect x="354" y="574" width="610" height="54" rx="6" fill="#fff" stroke="#7D8B99" stroke-width="1.2"/>
<text x="368" y="596" font-size="12.5" font-weight="600" fill="#1B2733" text-anchor="start">Repositorios (Spring Data JPA)</text>
<text x="368" y="614" font-size="11.5" font-weight="400" fill="#5B6B7A" text-anchor="start">Consultas y persistencia. No saben nada de HTTP.</text>
<rect x="974" y="450" width="172" height="178" rx="6" fill="#FFE08A" stroke="#7D8B99" stroke-width="1.2"/>
<text x="986" y="472" font-size="12.5" font-weight="700" fill="#1B2733" text-anchor="start">Transversal</text>
<text x="986" y="494" font-size="11.5" font-weight="400" fill="#5B6B7A" text-anchor="start">Seguridad: sesión</text>
<text x="986" y="512" font-size="11.5" font-weight="400" fill="#5B6B7A" text-anchor="start">con cookie y roles</text>
<text x="986" y="530" font-size="11.5" font-weight="400" fill="#5B6B7A" text-anchor="start">Validación de datos</text>
<text x="986" y="548" font-size="11.5" font-weight="400" fill="#5B6B7A" text-anchor="start">de entrada</text>
<text x="986" y="566" font-size="11.5" font-weight="400" fill="#5B6B7A" text-anchor="start">Manejo de errores</text>
<text x="986" y="584" font-size="11.5" font-weight="400" fill="#5B6B7A" text-anchor="start">en un solo lugar</text>
<text x="354" y="668" font-size="11.5" font-weight="400" fill="#5B6B7A" text-anchor="start">Patrón MVC: el controlador recibe, el servicio y las entidades son el modelo, y la vista es el JSON que consume React.</text>
<path d="M750 682 V742" fill="none" stroke="#56677A" stroke-width="1.8" marker-end="url(#punta)"/><rect x="678" y="701" width="144" height="20" rx="10" fill="#fff" stroke="#E1E6EB"/><text x="750" y="715" font-size="11.5" font-weight="400" fill="#5B6B7A" text-anchor="middle">JDBC · consultas SQL</text>
<rect x="480" y="742" width="540" height="90" rx="6" fill="#F3C58E" stroke="#7D8B99" stroke-width="1.2" filter="url(#sombra)"/>
<text x="494" y="768" font-size="14" font-weight="700" fill="#1B2733" text-anchor="start">MySQL 8 · base gestion_almacen</text>
<text x="494" y="790" font-size="11.5" font-weight="400" fill="#5B6B7A" text-anchor="start">7 tablas con claves foráneas, restricciones e índices. Motor InnoDB.</text>
<text x="494" y="810" font-size="11.5" font-weight="400" fill="#5B6B7A" text-anchor="start">Guarda catálogo, usuarios, movimientos de stock, ventas y pagos.</text>
<rect x="40" y="200" width="230" height="78" rx="6" fill="#C9B9E8" stroke="#7D8B99" stroke-width="1.2" filter="url(#sombra)"/>
<text x="54" y="224" font-size="13" font-weight="700" fill="#1B2733" text-anchor="start">Lector de código de barras</text>
<text x="54" y="244" font-size="11.5" font-weight="400" fill="#5B6B7A" text-anchor="start">Se conecta por USB.</text>
<text x="54" y="261" font-size="11.5" font-weight="400" fill="#5B6B7A" text-anchor="start">El sistema lo lee como teclado.</text>
<path d="M270 239 H340" fill="none" stroke="#56677A" stroke-width="1.8" marker-end="url(#punta)"/>
<rect x="40" y="330" width="230" height="78" rx="6" fill="#C9B9E8" stroke="#7D8B99" stroke-width="1.2" filter="url(#sombra)"/>
<text x="54" y="354" font-size="13" font-weight="700" fill="#1B2733" text-anchor="start">Impresora de tickets</text>
<text x="54" y="374" font-size="11.5" font-weight="400" fill="#5B6B7A" text-anchor="start">Recibe el comprobante</text>
<text x="54" y="391" font-size="11.5" font-weight="400" fill="#5B6B7A" text-anchor="start">desde el navegador.</text>
<path d="M340 369 H272" fill="none" stroke="#56677A" stroke-width="1.8" marker-end="url(#punta)"/>
<rect x="1230" y="470" width="290" height="92" rx="6" fill="#C9B9E8" stroke="#7D8B99" stroke-width="1.2" stroke-dasharray="7 4" filter="url(#sombra)"/>
<text x="1244" y="494" font-size="13" font-weight="700" fill="#1B2733" text-anchor="start">MercadoPago (fase futura)</text>
<text x="1244" y="514" font-size="11.5" font-weight="400" fill="#5B6B7A" text-anchor="start">API externa. Genera el QR y</text>
<text x="1244" y="531" font-size="11.5" font-weight="400" fill="#5B6B7A" text-anchor="start">avisa cuando el pago se acredita.</text>
<text x="1244" y="548" font-size="11.5" font-weight="400" fill="#5B6B7A" text-anchor="start">Es lo único que necesita internet.</text>
<path d="M1160 516 H1230" fill="none" stroke="#56677A" stroke-width="1.8" marker-end="url(#punta)" stroke-dasharray="7 4"/><rect x="1171" y="493" width="48" height="20" rx="10" fill="#fff" stroke="#E1E6EB"/><text x="1195" y="507" font-size="11.5" font-weight="400" fill="#5B6B7A" text-anchor="middle">HTTPS</text>
<text x="40" y="872" font-size="14" font-weight="700" fill="#1B2733" text-anchor="start">Por qué esta arquitectura</text>
<circle cx="46" cy="894" r="3" fill="#56677A"/>
<text x="58" y="898" font-size="12" font-weight="400" fill="#5B6B7A" text-anchor="start">Cada capa tiene una sola responsabilidad, así se puede cambiar la pantalla sin tocar las reglas del negocio (RNF-05).</text>
<circle cx="46" cy="916" r="3" fill="#56677A"/>
<text x="58" y="920" font-size="12" font-weight="400" fill="#5B6B7A" text-anchor="start">El backend expone una API REST: mañana la misma API puede alimentar una tienda web sin reescribir el sistema.</text>
<circle cx="46" cy="938" r="3" fill="#56677A"/>
<text x="58" y="942" font-size="12" font-weight="400" fill="#5B6B7A" text-anchor="start">Todo corre en la terminal del comercio, por eso vender no depende de internet (RNF-04).</text>
</svg>
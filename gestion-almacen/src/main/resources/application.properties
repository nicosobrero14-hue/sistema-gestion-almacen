spring.application.name=gestion-almacen
server.port=8080

# El usuario y la clave de MySQL van en application-local.properties, que no se sube al repositorio.
spring.profiles.active=local

spring.datasource.url=jdbc:mysql://localhost:3306/gestion_almacen
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# validate: Hibernate no modifica las tablas, solo verifica que el mapeo coincida con la base.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Muestra las consultas en la consola durante el desarrollo.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Sesion: dura una jornada de trabajo. La cookie no la puede leer ningun script y no viaja desde otros sitios.
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Carpeta donde quedan las fotos de los productos. Fuera del proyecto: son datos del comercio.
app.images.folder=${user.home}/gestion-almacen/imagenes

# Una foto de producto no deberia pesar mas que esto.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Balanza (RF-12). El puerto depende del equipo, asi que el valor real va en
# application-local.properties. Vacio significa que este equipo no tiene balanza: el peso se
# escribe a mano y el comercio sigue vendiendo.
scale.port=

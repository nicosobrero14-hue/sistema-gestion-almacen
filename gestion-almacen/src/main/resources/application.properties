spring.application.name=gestion-almacen
server.port=8080

# El usuario y la clave de MySQL van en application-local.properties, que no se sube al repositorio.
spring.profiles.active=local

spring.datasource.url=jdbc:mysql://localhost:3306/gestion_almacen?serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# validate: Hibernate no modifica las tablas, solo verifica que el mapeo coincida con la base.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Muestra las consultas en la consola durante el desarrollo.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
